site_name: Vadim Vorobiov | Portfolio
site_author: Vadim Vorobiov
site_description: >-
  My portfolio of Data Science and AI projects. Discover my analyses, models, and applications.

# Ulepszona konfiguracja motywu
theme:
  name: material
  palette:
    # Automatyczny tryb jasny/ciemny
    primary: indigo
    accent: indigo
    scheme: default
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

# Dodanie ikon do menu (wymaga fontawesome)
nav:
  - Home: index.md
  - "Current Project":
      - "Language Assistant": language_helper/index.md
  - "Previous Projects":
      - "AI Video Subtitle Generator": subtitle_generator.md
      - "Warsaw Real Estate Calculator": mieszkania/index.md
      - "Olist E-commerce Analysis": olist/index.md
      - "Iris Classification": iris/index.md
      - "NYC Airbnb Market Analysis": airbnb/index.md
      - "Multimedia Chatbot Assistant (RAG)": chatbot.md
      - "World GDP Dashboard": gdp_dashboard.md
  - Status: status.md

# Rozszerzenia Markdown dla Data Science
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables